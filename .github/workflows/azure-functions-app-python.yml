name: Deploy SMALL-RAG 

on:
  push:
    branches: 
      - main

env:
  IMAGE_NAME: basic-rag-application

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 'Checkout Source'
      uses: actions/checkout@v4

    
    - name: Setup Python 3.10-slim Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10-slim'

    - name: build docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest .

    - name: login to docker
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest

    - name: deploy to azure vm
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.VM_HOST}}
        username: ${{ secrets.VM_USERNAME}}
        key: ${{ secrets.VM_SSH_KEY}}
        script: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest 
          docker stop ${{ secrets.IMAGE_NAME }} || true
          docker rm ${{ secrets.IMAGE_NAME }} || true
          docker run -d --name ${{ secrets.IMAGE_NAME }} --restart unless-stopped -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/${{ secrets.IMAGE_NAME }}:latest
          docker image prune -f
